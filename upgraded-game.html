<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extraction Run 2.0</title>
    <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #172033, #050a12 62%);
  color: #e2e8f0;
  font-family: Arial, sans-serif;
}

.game-shell {
  width: 100%;
  min-height: 100vh;
  padding: 16px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: 16px;
}

.hud {
  grid-column: 1 / -1;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

.panel {
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid rgba(148, 163, 184, 0.4);
  border-radius: 8px;
  padding: 10px 14px;
  font-weight: bold;
  min-width: 100px;
  text-align: center;
}

.status {
  flex: 1;
  min-width: 220px;
}

canvas {
  width: 100%;
  height: auto;
  aspect-ratio: 12 / 7;
  background: linear-gradient(180deg, #111827, #0b1520);
  border: 2px solid rgba(148, 163, 184, 0.4);
  border-radius: 12px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.section {
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid rgba(148, 163, 184, 0.4);
  border-radius: 10px;
  padding: 12px;
}

.section h3 {
  margin: 0 0 10px 0;
  color: #4ade80;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

#weaponList {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.weapon-card {
  background: rgba(30, 41, 59, 0.7);
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-left: 4px solid #60a5fa;
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
  transition: 0.2s ease;
  font-size: 13px;
}

.weapon-card.active {
  background: rgba(96, 165, 250, 0.15);
  border-left-color: #4ade80;
}

.weapon-card:hover {
  transform: translateY(-1px);
}

.inventory-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.inventory-slot {
  min-height: 56px;
  border-radius: 8px;
  background: rgba(30, 41, 59, 0.7);
  border: 1px solid rgba(148, 163, 184, 0.3);
  display: grid;
  place-items: center;
  font-size: 11px;
  text-align: center;
  padding: 4px;
}

.inventory-slot.filled {
  background: rgba(74, 222, 128, 0.12);
  border-color: rgba(74, 222, 128, 0.6);
  color: #a7f3d0;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  font-size: 13px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.7);
  display: grid;
  place-items: center;
  z-index: 20;
}

.hidden {
  display: none;
}

.modal-box {
  background: rgba(15, 23, 42, 0.96);
  border: 2px solid rgba(74, 222, 128, 0.7);
  border-radius: 12px;
  padding: 28px 32px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.modal-box h2 {
  margin-top: 0;
  color: #4ade80;
}

#restartButton {
  background: #4ade80;
  color: #052e16;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

@media (max-width: 980px) {
  .game-shell {
    grid-template-columns: 1fr;
  }
}
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="panel">HP: <span id="hp">100</span></div>
        <div class="panel">Ammo: <span id="ammo">30</span></div>
        <div class="panel">Loot: <span id="loot">0/4</span></div>
        <div class="panel">Score: <span id="score">0</span></div>
        <div class="panel status" id="statusText">Search loot and escape</div>
      </div>

      <canvas id="gameCanvas" width="1200" height="700"></canvas>

      <div class="sidebar">
        <div class="section">
          <h3>Weapons</h3>
          <div id="weaponList"></div>
        </div>

        <div class="section">
          <h3>Inventory</h3>
          <div id="inventoryGrid" class="inventory-grid"></div>
        </div>

        <div class="section">
          <h3>Stats</h3>
          <div class="stat-row"><span>Level</span><span id="level">1</span></div>
          <div class="stat-row"><span>Kills</span><span id="kills">0</span></div>
          <div class="stat-row"><span>Deaths</span><span id="deaths">0</span></div>
          <div class="stat-row"><span>Time</span><span id="timer">00:00</span></div>
          <div class="stat-row"><span>Boss</span><span id="bossStatus">Dormant</span></div>
        </div>
      </div>

      <div id="gameOverModal" class="modal hidden">
        <div class="modal-box">
          <h2 id="modalTitle">Mission Failed</h2>
          <p id="modalMessage">You were eliminated.</p>
          <button id="restartButton">Restart</button>
        </div>
      </div>
    </div>

    <script src="upgraded-game.js"></script>
  </body>
</html>
