<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extraction Run</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="panel">Health: <span id="healthText">100</span></div>
        <div class="panel">Loot: <span id="lootText">0/3</span></div>
        <div class="panel" id="statusText">Search for loot</div>
      </div>

      <canvas id="gameCanvas" width="960" height="540"></canvas>

      <div class="controls">
        <span>WASD move</span>
        <span>Mouse aim</span>
        <span>Click to shoot</span>
        <span>R restart</span>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
